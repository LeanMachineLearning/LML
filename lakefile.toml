name = "LeanMachineLearning"
defaultTargets = ["LeanMachineLearning", "LMLExtra"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# Enable all mathlib linters: automatically matches what mathlib uses.
weak.linter.mathlibStandardSet = true

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.33.0"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "cf65d43b4f5e1a79482e8c488d121853b9d7ca05"

[[lean_lib]]
name = "LeanMachineLearning"

# Companion library with lighter review: may use everything in `LeanMachineLearning`.
# `LeanMachineLearning` may use its theorems (in proofs) but never its data; this is enforced by
# the `extraData` environment linter and by `scripts/check_extra_imports.sh`.
[[lean_lib]]
name = "LMLExtra"

# Tests. Not a default target: built explicitly in CI and not linted.
[[lean_lib]]
name = "LMLTest"

[[lean_lib]]
name = "LMLTutorial"
globs = ["LMLTutorial.*"]

[[lean_exe]]
name = "tutorial"
srcDir = "LMLTutorial/"
root = "Tutorial"
