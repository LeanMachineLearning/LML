name = "LeanMachineLearning"
defaultTargets = ["LeanMachineLearning"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
# Enable all mathlib linters: automatically matches what mathlib uses.
weak.linter.mathlibStandardSet = true

# Mathlib comes through Statlib, at the commit Statlib pins. Statlib is required before Verso:
# Lake gives precedence to later requires for shared dependencies, so Verso's `subverso` pin wins
# over Statlib's.
[[require]]
name = "Statlib"
git = "https://github.com/stat-lib/statlib"
rev = "main"

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "LeanMachineLearning"

[[lean_lib]]
name = "LMLTutorial"
globs = ["LMLTutorial.*"]

[[lean_exe]]
name = "tutorial"
srcDir = "LMLTutorial/"
root = "Tutorial"
